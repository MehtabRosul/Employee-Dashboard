<div class="employee-card" [@fadeInScale]>
    <div class="card-header">
        <div class="avatar-section">
            <div class="avatar-wrapper">
                <img [src]="employee.avatar" [alt]="employee.name" class="avatar">
                <div class="status-indicator" [class.active]="employee.status === 'Active'"></div>
            </div>
        </div>

        <div class="card-actions">
            <button class="btn-icon btn-ghost" (click)="onEdit()" title="Edit Employee">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18"
                    height="18">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
            </button>
            <button class="btn-icon btn-ghost text-error" (click)="onDelete()" title="Delete Employee">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18"
                    height="18">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            </button>
        </div>
    </div>

    <div class="card-body">
        <h3 class="employee-name">{{ employee.name }}</h3>
        <p class="employee-email">{{ employee.email }}</p>

        <div class="employee-meta">
            <span class="badge" [style.background-color]="getDepartmentColor(employee.department) + '15'"
                [style.color]="getDepartmentColor(employee.department)"
                [style.border-color]="getDepartmentColor(employee.department) + '30'">
                {{ employee.department }}
            </span>

            <span class="badge" [class]="getStatusBadgeClass(employee.status)">
                {{ employee.status }}
            </span>

            <span class="badge badge-outline">
                {{ employee.gender }}
            </span>

            <span class="badge badge-accent">
                {{ employee.age }} yrs
            </span>
        </div>

        <div class="employee-info">
            <div class="info-item">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16"
                    height="16">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span>Joined {{ formatDate(employee.dateOfJoining) }}</span>
            </div>

            <div class="info-item" *ngIf="employee.performance">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16"
                    height="16">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                </svg>
                <span>{{ employee.performance }}% Performance</span>
            </div>
        </div>

        <div class="performance-bar" *ngIf="employee.performance">
            <div class="progress">
                <div class="progress-bar" [style.width.%]="employee.performance"></div>
            </div>
        </div>
    </div>
</div>
